name: Fetch Clone Statistics

on:
  schedule:
    # Runs every night at midnight (UTC)
    - cron: "0 0 * * *"
  workflow_dispatch: # Allows manual trigger anytime

jobs:
  track-traffic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Track Repository Traffic
        uses: jgehrcke/github-repo-stats@v1.4.2
        with:
          ghtoken: ${{ secrets.TRAFFIC_TOKEN }}
